# Baseline copied from the git-hooks-setup skill (dev-essentials plugin); the Python
# hooks below it come from the python-lib-docs skill (python-dev plugin).
fail_fast: false

repos:
  # Blocks staged secrets. The golang hook builds gitleaks itself, so neither developers
  # nor CI need it installed. Allowlists live in .gitleaks.toml, added only when needed.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Common spelling errors in code, comments and docs. Settings are in pyproject.toml
  # ([tool.codespell]).
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  # JSON and YAML formatting.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.10.1
    hooks:
      - id: prettier
        types_or: [yaml, json5]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff range in pyproject.toml.
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types: [python]
        files: ^src/|^tests/
        pass_filenames: false
        require_serial: true

  # The plugin checks, before every commit and in the static-checks job of CI. From the
  # claude-plugin-knowledge skill (skill-crafting plugin): appended under `repos:` of
  # .pre-commit-config.yaml, below the git-hooks-setup baseline (dev-essentials plugin).
  # In a pull or merge request pipeline the script also applies the version policy
  # against the target branch, which it fetches itself; a local commit skips it. prek
  # builds the hook's Python environment with PyYAML itself. It checks the working tree,
  # not only what is staged.
  - repo: local
    hooks:
      - id: plugin-checks
        name: plugin checks
        entry: python scripts/plugin-checks/run-plugin-checks.py
        language: python
        additional_dependencies: [pyyaml==6.0.2]
        pass_filenames: false
        always_run: true
        require_serial: true
