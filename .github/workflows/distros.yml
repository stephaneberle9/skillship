# Reusable workflow: deliver a source repo's distros from GitHub Actions.
#
# Call it from the source repo, pinned to the commit of a skillship release tag
# (gh api repos/stephaneberle9/skillship/commits/v<version> --jq .sha), from a
# workflow of its own such as .github/workflows/deliver-distros.yml:
#
#   jobs:
#     deliver:
#       uses: stephaneberle9/skillship/.github/workflows/distros.yml@<sha> # v<version>
#       with:
#         distro: ${{ inputs.distro }}
#         dry-run: ${{ inputs.dry-run }}
#         auto-only: ${{ github.event_name == 'push' }}
#       secrets: inherit
#
# One job per distro runs `skillship deliver`, with the skillship version from
# `distros/.skillship-version` (or the `skillship-version` input). Archives and
# Agensi packs become a workflow artifact; git targets need credentials, read
# per distro, the distro's name upper-cased with `_` for `-` as KEY:
#
#   secrets  DISTRO_<KEY>_DEPLOY_TOKEN, DISTRO_<KEY>_SIGNING_KEY,
#            DISTRO_<KEY>_SIGNING_KEY_PASSPHRASE
#   vars     DISTRO_<KEY>_DEPLOY_USER, DISTRO_<KEY>_COMMITTER_NAME,
#            DISTRO_<KEY>_COMMITTER_EMAIL
#
# each falling back to the same name without `<KEY>_`. With `environments:
# true`, each job runs in the environment `distro-<name>`, whose secrets then
# serve as the unprefixed names, and whose protection rules (required
# reviewers) gate the delivery; environments need a public repository or a
# paid plan for a private one. See skillship's README, "Deliver from CI".
name: Deliver distros

on:
  workflow_call:
    inputs:
      distro:
        description: "The distro to deliver; empty for all (or all with `auto` under auto-only)"
        type: string
        default: ""
      auto-only:
        description: "Deliver only the distros marked `auto: true`, as on a push"
        type: boolean
        default: false
      dry-run:
        description: Prepare and check every delivery, push nothing
        type: boolean
        default: false
      environments:
        description: Run each distro's job in the environment `distro-<name>`
        type: boolean
        default: false
      skillship-version:
        description: "The skillship version, or a pip requirement such as git+https://...@<sha>; empty to read distros/.skillship-version"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.list.outputs.distros }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - id: version
        env:
          GIVEN: ${{ inputs.skillship-version }}
        run: |
          v="$GIVEN"
          [ -n "$v" ] || v="$(tr -d '[:space:]' < distros/.skillship-version 2>/dev/null || true)"
          if [ -z "$v" ]; then
            echo "::error::no skillship version: commit distros/.skillship-version or pass skillship-version"
            exit 1
          fi
          # a bare version means the PyPI release; anything else is a pip requirement
          case "$v" in *://*|*@*) spec="$v" ;; *) spec="skillship==$v" ;; esac
          echo "version=$spec" >> "$GITHUB_OUTPUT"
      - id: list
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DISTRO: ${{ inputs.distro }}
          AUTO_ONLY: ${{ inputs.auto-only }}
        run: |
          args=(list --json)
          [ "$AUTO_ONLY" = true ] && args+=(--auto)
          all="$(uvx --from "$VERSION" skillship "${args[@]}")"
          if [ -n "$DISTRO" ]; then
            picked="$(jq -c --arg d "$DISTRO" '[.[] | select(.name == $d)]' <<<"$all")"
            if [ "$picked" = "[]" ]; then
              echo "::error::no distro named $DISTRO"
              exit 1
            fi
          else
            picked="$all"
          fi
          echo "distros=$picked" >> "$GITHUB_OUTPUT"
          echo "Delivering: $(jq -r 'map(.name) | join(", ")' <<<"$picked")"

  # Two copies of one job: `environment:` cannot be left out by an expression.
  deliver:
    name: Deliver ${{ matrix.distro.name }}
    needs: plan
    if: needs.plan.outputs.distros != '[]' && !inputs.environments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
    concurrency:
      group: distro-${{ matrix.distro.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # deliver rebuilds the last delivery from its source commit
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Deliver
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NAME: ${{ matrix.distro.name }}
          DRY_RUN: ${{ inputs.dry-run }}
          DISTRO_DEPLOY_TOKEN: ${{ secrets[format('DISTRO_{0}_DEPLOY_TOKEN', matrix.distro.key)] || secrets.DISTRO_DEPLOY_TOKEN }}
          DISTRO_SIGNING_KEY: ${{ secrets[format('DISTRO_{0}_SIGNING_KEY', matrix.distro.key)] || secrets.DISTRO_SIGNING_KEY }}
          DISTRO_SIGNING_KEY_PASSPHRASE: ${{ secrets[format('DISTRO_{0}_SIGNING_KEY_PASSPHRASE', matrix.distro.key)] || secrets.DISTRO_SIGNING_KEY_PASSPHRASE }}
          DISTRO_DEPLOY_USER: ${{ vars[format('DISTRO_{0}_DEPLOY_USER', matrix.distro.key)] || vars.DISTRO_DEPLOY_USER }}
          DISTRO_COMMITTER_NAME: ${{ vars[format('DISTRO_{0}_COMMITTER_NAME', matrix.distro.key)] || vars.DISTRO_COMMITTER_NAME }}
          DISTRO_COMMITTER_EMAIL: ${{ vars[format('DISTRO_{0}_COMMITTER_EMAIL', matrix.distro.key)] || vars.DISTRO_COMMITTER_EMAIL }}
        run: &deliver |
          args=(deliver "$NAME")
          [ "$DRY_RUN" = true ] && args+=(--dry-run)
          set -o pipefail
          status=0
          uvx --from "$VERSION" skillship "${args[@]}" 2>&1 | tee deliver.log || status=$?
          {
            echo "### $NAME"
            echo '```'
            cat deliver.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-${{ matrix.distro.name }}
          path: |
            dist/${{ matrix.distro.name }}/
            !dist/${{ matrix.distro.name }}/staging/
          if-no-files-found: ignore

  deliver-in-environment:
    name: Deliver ${{ matrix.distro.name }}
    needs: plan
    if: needs.plan.outputs.distros != '[]' && inputs.environments
    runs-on: ubuntu-latest
    environment: distro-${{ matrix.distro.name }}
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.plan.outputs.distros) }}
    concurrency:
      group: distro-${{ matrix.distro.name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Deliver
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NAME: ${{ matrix.distro.name }}
          DRY_RUN: ${{ inputs.dry-run }}
          DISTRO_DEPLOY_TOKEN: ${{ secrets[format('DISTRO_{0}_DEPLOY_TOKEN', matrix.distro.key)] || secrets.DISTRO_DEPLOY_TOKEN }}
          DISTRO_SIGNING_KEY: ${{ secrets[format('DISTRO_{0}_SIGNING_KEY', matrix.distro.key)] || secrets.DISTRO_SIGNING_KEY }}
          DISTRO_SIGNING_KEY_PASSPHRASE: ${{ secrets[format('DISTRO_{0}_SIGNING_KEY_PASSPHRASE', matrix.distro.key)] || secrets.DISTRO_SIGNING_KEY_PASSPHRASE }}
          DISTRO_DEPLOY_USER: ${{ vars[format('DISTRO_{0}_DEPLOY_USER', matrix.distro.key)] || vars.DISTRO_DEPLOY_USER }}
          DISTRO_COMMITTER_NAME: ${{ vars[format('DISTRO_{0}_COMMITTER_NAME', matrix.distro.key)] || vars.DISTRO_COMMITTER_NAME }}
          DISTRO_COMMITTER_EMAIL: ${{ vars[format('DISTRO_{0}_COMMITTER_EMAIL', matrix.distro.key)] || vars.DISTRO_COMMITTER_EMAIL }}
        run: *deliver
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-${{ matrix.distro.name }}
          path: |
            dist/${{ matrix.distro.name }}/
            !dist/${{ matrix.distro.name }}/staging/
          if-no-files-found: ignore
