name: Publish to PyPI
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The checks of the commit being released, run again here. A release can be
  # created from any tag, whatever the state of that commit's own checks, so
  # without these jobs a red commit can be published.
  static_checks:
    uses: ./.github/workflows/run-static-checks.yml
  run_tests:
    uses: ./.github/workflows/run-tests.yml
  run_tests_lowest:
    uses: ./.github/workflows/run-tests-lowest.yml

  pypi-publish:
    name: Upload to PyPI
    needs: [static_checks, run_tests, run_tests_lowest]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # For PyPI's trusted publishing
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Build
        run: uv build

      - name: Check version format
        run: |
          # Extract version from the built package
          VERSION=$(ls dist/*.whl | head -n1 | sed -E 's/.*-([0-9].*)-.*/\1/')
          echo "Package version: $VERSION"

          # Check if version contains dev/post markers (development version)
          if [[ "$VERSION" =~ (dev|post.*dev) ]]; then
            echo "❌ ERROR: Cannot publish development version: $VERSION"
            echo "Please create a proper Git tag first (e.g., 'git tag v0.1.0')"
            exit 1
          fi

          echo "✅ Version $VERSION is valid for publishing"

      - name: Publish to PyPI
        run: uv publish -v dist/*
